name: build

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: ['1.5']
        # The older game versions only change game logic, so one OS covers them.
        include:
          - { os: ubuntu-latest, version: '1.4' }
          - { os: ubuntu-latest, version: '1.3D' }
          - { os: ubuntu-latest, version: '1.3D-sw' }

    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgl-dev

      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2

      # Windows has no SDL2 installed, so this also tests the FetchContent path.
      - name: Configure
        shell: bash
        run: |
          v='${{ matrix.version }}'
          flags="-DDUKE3D_VERSION=${v%-sw}"
          if [[ $v == *-sw ]]; then flags="$flags -DDUKE3D_SHAREWARE=ON"; fi
          cmake --preset default $flags

      - name: Build
        run: cmake --build --preset default --parallel

      - name: Test
        run: ctest --preset default

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: duke3d-${{ runner.os }}${{ matrix.version != '1.5' && format('-{0}', matrix.version) || '' }}
          path: build/bin/
